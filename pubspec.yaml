name: jodija_repository
description: A Flutter data repository and networking framework for single and multi-solution architectures with Dio HTTP client, Firebase integration, and typed error handling.
version: 1.7.2
homepage: https://github.com/zeftawyapps/JoDija_reposatory
repository: https://github.com/zeftawyapps/JoDija_reposatory
issue_tracker: https://github.com/zeftawyapps/JoDija_reposatory/issues

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

topics:
  - repository
  - networking
  - firebase
  - dio
  - architecture

environment:
  sdk: ">=3.0.6 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ">=3.4.1 <6.0.0"
  cloud_firestore: ">=5.4.1 <8.0.0"
  firebase_auth: ">=5.3.0 <8.0.0"
  firebase_storage: ">=12.3.0 <15.0.0"
  firebase_messaging: ">=15.1.2 <18.0.0"
  google_sign_in: ^7.2.0
  dio: ^5.4.0
  http_parser: ^4.0.0
  pretty_dio_logger: ^1.0.0
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
